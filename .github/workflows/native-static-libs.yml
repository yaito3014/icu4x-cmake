name: native-static-libs

# Verify that the native link libraries embedded in
# cmake/native-static-libs.cmake still match what rustc reports on each
# platform. If icu_capi or the Rust toolchain changes what it links against,
# this job fails and prints the values to update the table with.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify embedded native-static-libs
        run: cmake -P cmake/verify-native-static-libs.cmake
